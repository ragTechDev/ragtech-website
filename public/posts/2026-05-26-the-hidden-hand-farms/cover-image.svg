<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">

  <style>
    :root {
      --bg-color: #fff9e6;
      --accent-1: #fda2a9;
      --accent-2: #a2d4d1;
      --text-primary: #8b5a49;
      --text-secondary: #a2805d;
    }
  </style>

  <defs>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--accent-1)" />
      <stop offset="100%" stop-color="var(--accent-2)" />
    </linearGradient>

    <pattern id="emojiPattern" width="110" height="100" patternUnits="userSpaceOnUse">
      <text x="20" y="35" font-size="32" opacity="0.08">📷</text>
      <text x="65" y="80" font-size="32" opacity="0.08">🤖</text>
    </pattern>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="var(--bg-color)" />
  <rect width="1200" height="630" fill="url(#emojiPattern)" />

  <!-- Decorative blobs -->
  <circle cx="150" cy="120" r="180" fill="var(--accent-1)" opacity="0.08"/>
  <circle cx="1050" cy="500" r="220" fill="var(--accent-2)" opacity="0.08"/>
  <circle cx="950" cy="120" r="140" fill="#fff3c1" opacity="0.15"/>

  <!-- Decorative right side: abstract hand + data circles -->
  <circle cx="950" cy="320" r="160" fill="var(--accent-2)" opacity="0.12"/>
  <circle cx="950" cy="320" r="110" fill="var(--accent-1)" opacity="0.10"/>
  <circle cx="950" cy="320" r="60" fill="var(--accent-2)" opacity="0.18"/>
  <text x="918" y="338" font-size="64" opacity="0.55">🦾</text>

  <!-- Accent bar -->
  <rect x="80" y="170" width="8" height="290"
        fill="url(#accentGradient)" rx="4"
        filter="url(#glow)"/>

  <!-- Title -->
  <text x="110" y="230"
        font-family="Inter, system-ui, sans-serif"
        font-size="64"
        font-weight="800"
        fill="var(--text-primary)">
    The Hidden
  </text>

  <text x="110" y="310"
        font-family="Inter, system-ui, sans-serif"
        font-size="64"
        font-weight="800"
        fill="url(#accentGradient)">
    Hand Farms
  </text>

  <text x="110" y="385"
        font-family="Inter, system-ui, sans-serif"
        font-size="30"
        font-weight="600"
        fill="var(--text-secondary)">
    How India Became the World's
  </text>

  <text x="110" y="425"
        font-family="Inter, system-ui, sans-serif"
        font-size="30"
        font-weight="600"
        fill="var(--text-secondary)">
    Motion Capture Lab for AI Robots
  </text>

  <!-- Tags -->
  <g transform="translate(110, 490)">
    <g>
      <rect width="60" height="34" rx="17" fill="white" stroke="var(--accent-1)" stroke-width="2"/>
      <text x="30" y="22" font-size="14" font-weight="700" fill="var(--accent-1)" text-anchor="middle">AI</text>
    </g>
    <g transform="translate(72, 0)">
      <rect width="100" height="34" rx="17" fill="white" stroke="var(--accent-2)" stroke-width="2"/>
      <text x="50" y="22" font-size="14" font-weight="700" fill="var(--accent-2)" text-anchor="middle">Robotics</text>
    </g>
    <g transform="translate(184, 0)">
      <rect width="74" height="34" rx="17" fill="white" stroke="var(--accent-1)" stroke-width="2"/>
      <text x="37" y="22" font-size="14" font-weight="700" fill="var(--accent-1)" text-anchor="middle">India</text>
    </g>
    <g transform="translate(270, 0)">
      <rect width="82" height="34" rx="17" fill="white" stroke="var(--accent-2)" stroke-width="2"/>
      <text x="41" y="22" font-size="14" font-weight="700" fill="var(--accent-2)" text-anchor="middle">Ethics</text>
    </g>
  </g>

  <!-- Author -->
  <text x="110" y="590"
        font-family="Inter, system-ui, sans-serif"
        font-size="16"
        fill="var(--text-secondary)"
        font-weight="600">
    Saloni • ragTech
  </text>

</svg>
