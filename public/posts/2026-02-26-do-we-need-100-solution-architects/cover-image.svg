<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fda2a9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a2d4d1;stop-opacity:1" />
    </linearGradient>
    
    <!-- Pattern of coder emoji -->
    <pattern id="coderPattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <text x="20" y="35" font-size="32" opacity="0.08">👩‍💻</text>
      <text x="65" y="80" font-size="32" opacity="0.06">👩‍💻</text>
    </pattern>
    
    <!-- Glowing effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Solid background -->
  <rect width="1200" height="630" fill="#fff9e6"/>
  
  <!-- Coder pattern background -->
  <rect width="1200" height="630" fill="url(#coderPattern)"/>
  
  <!-- Decorative elements -->
  <circle cx="150" cy="120" r="180" fill="#fda2a9" opacity="0.08"/>
  <circle cx="1050" cy="500" r="220" fill="#a2d4d1" opacity="0.08"/>
  <circle cx="900" cy="100" r="120" fill="#fff3c1" opacity="0.15"/>
  
  <!-- Large "100" in background -->
  <text x="600" y="420" font-family="Inter, system-ui, sans-serif" font-size="320" font-weight="900" fill="#a2805d" text-anchor="middle" opacity="0.08">100</text>
  
  <!-- Accent line -->
  <rect x="80" y="180" width="8" height="140" fill="url(#accentGradient)" rx="4" filter="url(#glow)"/>
  
  <!-- Main title -->
  <text x="110" y="230" font-family="Inter, system-ui, sans-serif" font-size="58" font-weight="800" fill="#8b5a49">
    Do We Need
  </text>
  <text x="110" y="300" font-family="Inter, system-ui, sans-serif" font-size="58" font-weight="800" fill="#8b5a49">
    100 Solution
  </text>
  <text x="110" y="370" font-family="Inter, system-ui, sans-serif" font-size="58" font-weight="800" fill="url(#accentGradient)">
    Architects?
  </text>
  
  <!-- Subtitle -->
  <text x="110" y="425" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#a2805d" font-weight="500">
    Why the future of tech isn't one big company
  </text>
  <text x="110" y="453" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#a2805d" font-weight="500">
    with 100 architects—it's 100 focused companies
  </text>
  
  <!-- Capybara overlay beside text -->
  <g transform="translate(700, 100)">
    <image xlink:href="/assets/laptop.png" x="0" y="0" width="450" height="450" opacity="1"/>
  </g>
  
  <!-- Tags -->
  <g transform="translate(110, 510)">
    <rect x="0" y="0" width="95" height="34" rx="17" fill="white" stroke="#fda2a9" stroke-width="2.5"/>
    <text x="47.5" y="22" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#fda2a9" text-anchor="middle" font-weight="700">Big Tech</text>
    
    <rect x="105" y="0" width="125" height="34" rx="17" fill="white" stroke="#a2d4d1" stroke-width="2.5"/>
    <text x="167.5" y="22" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#a2d4d1" text-anchor="middle" font-weight="700">Monopolies</text>
    
    <rect x="240" y="0" width="50" height="34" rx="17" fill="white" stroke="#fda2a9" stroke-width="2.5"/>
    <text x="265" y="22" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#fda2a9" text-anchor="middle" font-weight="700">AI</text>
  </g>
  
  <!-- Author attribution -->
  <text x="110" y="585" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#a2805d" font-weight="600">
    by Natasha • ragTech
  </text>
</svg>
